<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche de Pré-Visite de Chantier</title>
<style>
  :root{
    --ink:#1a1a1a;
    --accent:#0072ce;
    --muted:#6b6b6b;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e9e9e6;
    color:var(--ink);
    margin:0;
    padding:14px;
    -webkit-tap-highlight-color:transparent;
  }
  .toolbar{
    position:sticky;
    top:0;
    z-index:20;
    max-width:1200px;
    margin:0 auto 12px auto;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    background:#e9e9e6;
    padding:8px 0;
  }
  .toolbar button{
    font-family:inherit;
    font-size:16px;
    padding:14px 20px;
    min-height:48px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
    border-radius:6px;
  }
  .toolbar button.secondary{background:#fff;color:var(--ink);}
  .toolbar button:active{opacity:.7;}

  /* Two-view navigation: main document, and a dedicated signature page */
  .view{display:none;}
  .view.active{display:block;}

  .sig-nav{
    max-width:1200px;
    margin:0 auto 14px auto;
  }
  .back-btn{
    font-family:inherit;
    font-size:15px;
    padding:11px 18px;
    min-height:44px;
    border:1px solid #ccc;
    background:#fff;
    color:var(--ink);
    border-radius:6px;
    cursor:pointer;
  }
  .back-btn:active{opacity:.7;}

  .doc-wrap{
    max-width:1200px;
    margin:0 auto 20px auto;
    background:#fff;
    border:1px solid #ccc;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }

  /* the scanned form, kept at its exact aspect ratio; all fields are
     positioned in % so they track the image at any display width */
  .doc{
    position:relative;
    width:100%;
    aspect-ratio:1195/865;
    container-type:inline-size;
    overflow:hidden;
  }
  .doc img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    -webkit-user-select:none;
    user-select:none;
    pointer-events:none;
  }
  .doc img.logo-color{
    position:absolute;
    left:2.929%;
    top:4.249%;
    width:16.234%;
    height:7.803%;
    pointer-events:none;
  }
  .logo-partner{
    position:absolute;
    object-fit:contain;
    pointer-events:none;
  }
  .logo-partner.logo-adekma{
    left:83.264%;
    top:6.291%;
    width:13.389%;
    height:4.757%;
  }
  .logo-partner.logo-l2m{
    left:84.998%;
    top:4.624%;
    width:10.251%;
    height:8.092%;
  }
  .logo-partner.is-hidden{display:none;}

  .logo-toggle{
    display:flex;
    gap:6px;
    align-items:center;
    margin-right:auto;
  }
  .logo-toggle span{
    font-size:12px;
    color:var(--muted);
    margin-right:2px;
  }
  .logo-toggle button{
    font-family:inherit;
    font-size:13px;
    padding:8px 12px;
    min-height:36px;
    border:1px solid #ccc;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    border-radius:6px;
  }
  .logo-toggle button.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  .sig-frame{
    position:absolute;
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    pointer-events:none;
  }

  .ov-text{
    position:absolute;
    border:none;
    background:rgba(255,255,80,0.16);
    font-family:'Segoe UI', Arial, sans-serif;
    color:#0a2a6b;
    padding:0 2px;
    outline:none;
    border-radius:2px;
  }
  .ov-text:focus{background:rgba(255,255,80,0.4);}
  .ov-text.ov-text-sm{
    letter-spacing:-0.2px;
  }
  .ov-text.ov-datetime{
    padding:0 1px;
  }
  .ov-text.ov-meta{
    background:rgba(0,114,206,0.08);
    font-weight:600;
    text-align:center;
  }
  .ov-text.ov-meta:focus{background:rgba(0,114,206,0.22);}

  .ov-label{
    position:absolute;
    font-family:'Segoe UI', Arial, sans-serif;
    color:#1a1a1a;
    white-space:nowrap;
    pointer-events:none;
    display:flex;
    align-items:center;
  }

  .ov-check{
    position:absolute;
    margin:0;
    cursor:pointer;
    accent-color:#0072ce;
    width:100%;
    height:100%;
  }

  /* Confirmation toast after a successful PDF save */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:#1a1a1a;
    color:#fff;
    padding:16px 24px;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:100;
    max-width:90vw;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .toast .toast-check{
    color:#4caf50;
    font-size:20px;
    flex-shrink:0;
  }

  /* Bottom action buttons: jump to signatures, then export */
  .bottom-actions{
    max-width:1200px;
    margin:0 auto 24px auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .bottom-actions button{
    font-family:inherit;
    font-size:17px;
    font-weight:600;
    padding:16px 32px;
    min-height:52px;
    width:100%;
    max-width:420px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid var(--ink);
  }
  .bottom-actions .goto-sig-btn{
    background:#fff;
    color:var(--ink);
  }
  .bottom-actions .pdf-btn{
    background:var(--ink);
    color:#fff;
  }
  .bottom-actions button:active{opacity:.75;}

  /* Signatures section, below the scanned page - full-size pads */
  .sig-section{
    max-width:1200px;
    margin:0 auto 24px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .sig-card{
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    padding:14px;
  }
  .sig-card .label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .sig-pad-wrap{
    position:relative;
    border:1.5px dashed #bbb;
    border-radius:6px;
    background:#fdfdfc;
  }
  .sig-pad-wrap canvas{
    display:block;
    width:100%;
    height:160px;
    touch-action:none;
    cursor:crosshair;
  }
  .sig-pad-wrap .sig-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:#bbb;
    pointer-events:none;
  }
  .sig-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
  }
  .sig-clear-btn{
    font-family:inherit;
    font-size:13px;
    padding:9px 14px;
    min-height:38px;
    border:1px solid #ccc;
    background:#fff;
    color:var(--muted);
    border-radius:6px;
    cursor:pointer;
  }
  .sig-clear-btn:active{opacity:.7;}

  footer.meta{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding:6px 0 20px 0;
  }

  @page{
    size: landscape;
    margin: 0;
  }
  @media print{
    body{background:#fff;padding:0;margin:0;}
    .toolbar, .sig-section, .bottom-actions, .sig-nav{display:none !important;}
    footer.meta, .toast{display:none !important;}
    .view{display:none !important;}
    #view-doc{display:block !important;}
    .doc-wrap{border:none;box-shadow:none;max-width:none;margin:0;}
    .ov-text{background:transparent;}
    .ov-check{opacity:1;}
  }

  @media (max-width:700px){
    .sig-section{grid-template-columns:1fr;}
  }
</style>
</head>

<div class="toast" id="toast"><span class="toast-check">✓</span><span id="toast-text"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // ---- Nom de fichier PDF ----
  const DEFAULT_TITLE = "Fiche de Pré-Visite de Chantier";

  function safeFilenamePart(str){
    return (str || "")
      .trim()
      .replace(/[\/\\:\*\?"<>\|]/g, '-')
      .replace(/\s+/g, ' ');
  }
  // Extrait "DD Ville" à partir d'une adresse contenant un code postal
  // (ex: "5 Le Porche, 44520 Le Grand-Auvergne" -> "44 Le Grand-Auvergne")
  function extractLocalite(adresse){
    const str = (adresse || "").trim();
    const m = str.match(/(\d{5})\s*[,\-]?\s*(.+)/);
    if(m){
      const dept = m[1].slice(0,2);
      const ville = m[2].trim();
      return ville ? `${dept} ${ville}` : dept;
    }
    return str;
  }
  function buildFilename(){
    const codeAffaire = safeFilenamePart(document.querySelector('input[name="code_affaire"]').value) || 'Code affaire';
    const localite = safeFilenamePart(extractLocalite(document.querySelector('input[name="adresse_livraison"]').value)) || 'Localite';
    return `Fiche de PréVisite-${codeAffaire}-${localite}`;
  }
  function updateDocTitle(){
    document.title = buildFilename();
  }
  function imgTypeFromDataUrl(url){
    return url.startsWith('data:image/png') ? 'PNG' : 'JPEG';
  }

  let toastTimer = null;
  function showToast(message){
    const toast = document.getElementById('toast');
    const text = document.getElementById('toast-text');
    if(!toast || !text) return;
    text.textContent = message;
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 4000);
  }

  function exportPDF(){
    let wasSigView = false;
    try {
      if(!window.jspdf){
        alert("Le module d'export PDF n'a pas pu se charger. Vérifiez votre connexion internet, patientez quelques secondes puis réessayez.");
        return;
      }
      stampSignatures();

      wasSigView = document.getElementById('view-sig').classList.contains('active');
      document.getElementById('view-doc').classList.add('active');
      document.getElementById('view-sig').classList.remove('active');
      // pas d'attente asynchrone ici : getBoundingClientRect ci-dessous force
      // un recalcul de mise en page synchrone, et Safari sur iPad bloque les
      // téléchargements déclenchés après une pause asynchrone dans un clic.

      const root = document.getElementById('docRoot');
      const rootRect = root.getBoundingClientRect();
      const scaleX = 1195 / rootRect.width;
      const scaleY = 865 / rootRect.height;
      function rectOf(el){
        const r = el.getBoundingClientRect();
        return {
          x: (r.left - rootRect.left) * scaleX,
          y: (r.top - rootRect.top) * scaleY,
          w: r.width * scaleX,
          h: r.height * scaleY
        };
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1195, 865], compress: true });

      const bgImg = document.querySelector('#docRoot img.bg');
      doc.addImage(bgImg.src, imgTypeFromDataUrl(bgImg.src), 0, 0, 1195, 865);

      const fournierLogo = document.querySelector('#docRoot img.logo-color');
      const fr = rectOf(fournierLogo);
      doc.addImage(fournierLogo.src, imgTypeFromDataUrl(fournierLogo.src), fr.x, fr.y, fr.w, fr.h);

      const partnerLogo = document.querySelector('#docRoot img.logo-partner:not(.is-hidden)');
      if(partnerLogo){
        const pr = rectOf(partnerLogo);
        doc.addImage(partnerLogo.src, imgTypeFromDataUrl(partnerLogo.src), pr.x, pr.y, pr.w, pr.h);
      }

      doc.setFont('helvetica', 'bold');
      doc.setTextColor(15, 45, 130);
      document.querySelectorAll('#docRoot .ov-text').forEach(el => {
        let value = el.value;
        if(!value) return;
        if(el.type === 'date'){
          const [y,m,d] = value.split('-');
          value = `${d}/${m}/${y}`;
        }
        const r = rectOf(el);
        const fontPx = parseFloat(getComputedStyle(el).fontSize) * scaleX;
        doc.setFontSize(Math.max(fontPx * 1.3, 10));
        doc.text(String(value), r.x + 2, r.y + r.h * 0.74);
      });

      document.querySelectorAll('#docRoot .ov-label').forEach(el => {
        const r = rectOf(el);
        const fontPx = parseFloat(getComputedStyle(el).fontSize) * scaleX;
        doc.setTextColor(26,26,26);
        doc.setFontSize(Math.max(fontPx * 1.3, 10));
        doc.text(el.textContent, r.x, r.y + r.h * 0.8);
      });
      doc.setFont('helvetica', 'normal');

      doc.setDrawColor(15, 45, 130);
      doc.setLineWidth(2.6);
      doc.setLineCap('round');
      doc.setLineJoin('round');
      document.querySelectorAll('#docRoot .ov-check').forEach(el => {
        if(!el.checked) return;
        const r = rectOf(el);
        const inset = Math.min(r.w, r.h) * 0.16;
        const x0 = r.x + inset,        y0 = r.y + r.h*0.52;
        const x1 = r.x + r.w*0.42,     y1 = r.y + r.h - inset;
        const x2 = r.x + r.w - inset,  y2 = r.y + inset*0.6;
        doc.line(x0,y0,x1,y1);
        doc.line(x1,y1,x2,y2);
      });

      const sigFrames = { 'sig-fournisseur': 'frame-sig-fournisseur', 'sig-client': 'frame-sig-client' };
      for(const [padId, frameId] of Object.entries(sigFrames)){
        const pad = pads[padId];
        const frameEl = document.getElementById(frameId);
        if(!pad || !frameEl) continue;
        const d = pad.dataUrl();
        if(!d || !d.w || !d.h) continue;
        const r = rectOf(frameEl);
        const padRatio = d.w / d.h;
        const frameRatio = r.w / r.h;
        let dw = r.w, dh = r.h, dx = r.x, dy = r.y;
        if(padRatio > frameRatio){ dh = r.w / padRatio; dy = r.y + (r.h - dh)/2; }
        else { dw = r.h * padRatio; dx = r.x + (r.w - dw)/2; }
        doc.addImage(d.url, 'PNG', dx, dy, dw, dh);
      }

      const filename = `${buildFilename()}.pdf`;
      doc.save(filename);
      showToast(`PDF enregistré : ${filename}`);
    } catch(err){
      alert("Erreur lors de la génération du PDF : " + (err && err.message ? err.message : err));
    } finally {
      if(wasSigView){
        document.getElementById('view-doc').classList.remove('active');
        document.getElementById('view-sig').classList.add('active');
      }
    }
  }
  function goToSignatures(){
    document.getElementById('view-doc').classList.remove('active');
    document.getElementById('view-sig').classList.add('active');
    window.scrollTo(0,0);
    Object.values(pads).forEach(p => p.refresh());
  }
  function backToDoc(){
    document.getElementById('view-sig').classList.remove('active');
    document.getElementById('view-doc').classList.add('active');
    window.scrollTo(0,0);
  }
  updateDocTitle();

  // ---- Signature pads ----
  const pads = {};
  function setupPad(canvas){
    const ctx = canvas.getContext('2d');
    const ph = document.getElementById('ph-' + canvas.id);
    let drawing = false, hasInk = false, last = null;

    function resize(){
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const imgData = hasInk ? canvas.toDataURL() : null;
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.lineWidth = 3.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0a0f2b';
      if(imgData){
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = imgData;
      }
    }
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    function start(e){
      drawing = true; hasInk = true;
      if(ph) ph.style.display = 'none';
      last = pos(e);
      canvas.setPointerCapture(e.pointerId);
    }
    function move(e){
      if(!drawing) return;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      e.preventDefault();
    }
    function end(){ drawing = false; }

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointerleave', end);
    canvas.addEventListener('pointercancel', end);
    window.addEventListener('resize', resize);
    resize();

    pads[canvas.id] = {
      isEmpty(){ return !hasInk; },
      dataUrl(){
        return hasInk ? { url: canvas.toDataURL('image/png'), w: canvas.width, h: canvas.height } : null;
      },
      clear(){
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0,0,rect.width,rect.height);
        hasInk = false;
        if(ph) ph.style.display = 'flex';
      },
      refresh(){ resize(); }
    };
  }
  document.querySelectorAll('.sig-pad-wrap canvas').forEach(setupPad);
  document.querySelectorAll('.sig-clear-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pad = pads[btn.dataset.target];
      if(pad) pad.clear();
    });
  });

  // ---- Insertion des signatures dans le cadre prévu du document avant impression ----
  function stampSignatures(){
    const map = { 'sig-fournisseur': 'frame-sig-fournisseur', 'sig-client': 'frame-sig-client' };
    for(const [padId, frameId] of Object.entries(map)){
      const pad = pads[padId];
      const frame = document.getElementById(frameId);
      if(!pad || !frame) continue;
      const d = pad.dataUrl();
      frame.style.backgroundImage = d ? `url(${d.url})` : 'none';
    }
  }

  // ---- Cases OUI/NON exclusives (une seule case cochée par ligne) ----
  document.querySelectorAll('.ov-check[data-group]').forEach(cb => {
    cb.addEventListener('change', () => {
      if(!cb.checked) return;
      document.querySelectorAll(`.ov-check[data-group="${cb.dataset.group}"]`).forEach(other => {
        if(other !== cb) other.checked = false;
      });
    });
  });

  function resetForm(){
    if(confirm("Effacer toutes les données saisies ?")){
      document.querySelectorAll('.ov-text').forEach(el => el.value = '');
      document.querySelectorAll('.ov-check').forEach(el => el.checked = false);
      Object.values(pads).forEach(p => p.clear());
      stampSignatures();
      setDefaultDateTime();
      updateDocTitle();
    }
  }

  // ---- Date de signature par défaut = aujourd'hui ----
  function setDefaultDateTime(){
    const el = document.getElementById('date_signature');
    if(!el) return;
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    el.value = value;
  }
  setDefaultDateTime();

  // ---- Choix du logo partenaire (par défaut : L2M) ----
  function setLogo(which){
    const l2m = document.getElementById('logo-l2m');
    const adekma = document.getElementById('logo-adekma');
    const btnL2m = document.getElementById('btn-logo-l2m');
    const btnAdekma = document.getElementById('btn-logo-adekma');
    const showL2m = which === 'l2m';
    l2m.classList.toggle('is-hidden', !showL2m);
    adekma.classList.toggle('is-hidden', showL2m);
    btnL2m.classList.toggle('active', showL2m);
    btnAdekma.classList.toggle('active', !showL2m);
  }
  setLogo('l2m');
</script>
